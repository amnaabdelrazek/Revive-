<button
  type="button"
  class="ticket"
  [class.selected]="selected"
  [class.is-full]="ticket.isFull"
  [disabled]="ticket.isFull || !ticket.available"
  (click)="select.emit()"
>
  <span class="ticket-date">
    <small>{{ ticket.day }}</small>
    <strong>{{ ticket.date }}</strong>
    <em>{{ ticket.time }}</em>
  </span>

  <span class="ticket-cut" aria-hidden="true"></span>

  <span class="ticket-info">
    <span class="ticket-topline">
      <span class="availability">
        <i class="fa-solid fa-circle"></i>
        {{ ticket.isFull ? 'مكتملة الحجز' : ticket.availability }}
      </span>

      <span
        class="ticket-category"
        [class.available]="ticket.category === 'available' && !ticket.isFull"
        [class.upcoming]="ticket.category === 'upcoming'"
        [class.paid]="ticket.category === 'paid' || ticket.isFull"
      >
        {{ ticket.isFull ? 'مكتملة' : ticket.categoryLabel }}
      </span>
    </span>

    @if (ticket.sessionNumber || ticket.title) {
      <div class="session-meta-line" style="margin-bottom: 4px; font-size: 13px;">
        <span class="session-num" style="background: rgba(79, 70, 229, 0.1); color: #4f46e5; padding: 2px 6px; border-radius: 4px; font-weight: 600;">
          جلسة #{{ ticket.sessionNumber }}
        </span>
        @if (ticket.title) {
          <span class="session-title" style="margin-right: 6px; font-weight: 600; color: #374151;">
            {{ ticket.title }}
          </span>
        }
      </div>
    }

    <strong>{{ ticket.specialist }}</strong>

    <small>
      <i class="fa-solid fa-video"></i>
      {{ ticket.type }}
      <b></b>
      <i class="fa-regular fa-clock"></i>
      {{ ticket.duration }}
    </small>

    <span class="price-line">
      <span>سعر الجلسة</span>
      <strong>{{ ticket.price }}</strong>
    </span>

    @if (!isIndividual) {
      <span class="seats-line">
        <span>المحجوز</span>
        <strong dir="ltr" style="font-weight: 700; color: #4f46e5; font-size: 14px;">
          {{ ticket.seatsReserved }}/{{ ticket.maxParticipants || ticket.seatsTotal }}
        </strong>
      </span>

      <span class="seat-progress" aria-hidden="true">
        <span [style.width.%]="getSeatPercent()"></span>
      </span>
    }
  </span>

  @if (showSelection) {
    @if (selected) {
      <i class="fa-solid fa-circle-check selection-icon"></i>
    } @else {
      <i class="fa-regular fa-circle selection-icon"></i>
    }
  }
</button>
